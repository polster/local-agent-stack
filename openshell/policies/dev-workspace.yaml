# PROFILE: dev-workspace -- agent can edit mounted repo and reach local MLX + package registries.
#
# Policy shape validated against OpenShell 0.1.x `version: 1` schema.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:
  mlx:
    name: mlx
    binaries:
      - path: /usr/local/lib/node_modules/opencode-ai/bin/opencode.exe
      - path: /usr/bin/curl
    endpoints:
      - host: "${MLX_HOST}"
        port: ${MLX_PORT}
        protocol: rest
        enforcement: enforce
        access: read-write
  npm:
    name: npm-registry
    binaries:
      - path: /usr/local/lib/node_modules/opencode-ai/bin/opencode.exe
      - path: /usr/bin/curl
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
  pypi:
    name: pypi
    binaries:
      - path: /usr/local/lib/node_modules/opencode-ai/bin/opencode.exe
      - path: /usr/bin/curl
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
