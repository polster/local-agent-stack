# PROFILE: readonly-review -- read-only repo inspection with no network egress.
#
# Policy shape validated against OpenShell 0.1.x `version: 1` schema.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /workspace
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

network_policies: {}
